# pkg.lyuba.dev : Postgres, worker (lit index.golang.org, télécharge les
# modules Lyuba depuis proxy.golang.org, remplit la base) et frontend.
# Rien de Google Cloud : file de travail dans Postgres, pas de profiler,
# pas d'error reporting, pas de Tag Manager.
#
# Lancer depuis ce dossier, avec le dépôt lyuba à côté de pkgsite
# (../../lyuba, utilisé par le replace de go.mod tant que lyuba n'est pas
# publié) :
#
#   docker compose up -d
#   http://localhost:8080
#
# Variables (fichier .env à côté, ou environnement) :
#   POSTGRES_PASSWORD        mot de passe de la base (défaut : postgres)
#   LYUBA_POLL               période de lecture de l'index (défaut : 1m)
#   GO_VERSION               image golang (défaut : 1.27)

x-database: &database
  GO_DISCOVERY_DATABASE_HOST: db
  GO_DISCOVERY_DATABASE_NAME: discovery-db
  GO_DISCOVERY_DATABASE_USER: postgres
  GO_DISCOVERY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

x-go: &go
  image: golang:${GO_VERSION:-1.27}
  working_dir: /pkgsite
  volumes:
    - ../:/pkgsite
    - ../../lyuba:/lyuba:ro
    - gomodcache:/go/pkg/mod
    - gocache:/root/.cache/go-build

services:
  db:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_DB: discovery-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LANG: C
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "discovery-db"]
      interval: 2s
      retries: 30

  # crée la base si besoin, puis applique les migrations de pkgsite
  migrate:
    <<: *go
    environment:
      <<: *database
    command: bash -c "go run ./devtools/cmd/db create && go run ./devtools/cmd/db migrate"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *go
    environment:
      <<: *database
      PORT: "8000"
      GO_DISCOVERY_LOG_LEVEL: info
    command: >
      go run ./cmd/worker -queue=postgres
      -poll_index_period=${LYUBA_POLL:-1m} -poll_index_limit=200
      -enqueue_period=${LYUBA_POLL:-1m} -enqueue_limit=50
    restart: on-failure
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    <<: *go
    environment:
      <<: *database
      PORT: "8080"
    command: go run ./cmd/frontend -host=0.0.0.0:8080 -queue=postgres
    # le worker et le frontend créent la file dans Postgres au démarrage :
    # si les deux le font en même temps, le perdant redémarre
    restart: on-failure
    ports:
      - 8080:8080
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  gomodcache:
  gocache:
