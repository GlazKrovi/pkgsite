# pkg.lyuba.dev: Postgres, worker (reads index.golang.org, downloads Lyuba
# modules from proxy.golang.org, fills the database) and frontend.
# Nothing from Google Cloud: the work queue lives in Postgres, no profiler,
# no error reporting, no Tag Manager.
#
# Run from this directory, with the lyuba repository next to pkgsite
# (../../lyuba, used by go.mod's replace until lyuba is published):
#
#   docker compose up -d
#   http://localhost:8080
#
# Variables (a .env file next to this one, or the environment):
#   POSTGRES_PASSWORD        database password (default: postgres)
#   LYUBA_POLL               index polling period (default: 1m)
#   GO_VERSION               golang image (default: 1.27)

x-database: &database
  GO_DISCOVERY_DATABASE_HOST: db
  GO_DISCOVERY_DATABASE_NAME: discovery-db
  GO_DISCOVERY_DATABASE_USER: postgres
  GO_DISCOVERY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

x-go: &go
  image: golang:${GO_VERSION:-1.27}
  working_dir: /pkgsite
  volumes:
    - ../:/pkgsite
    - ../../lyuba:/lyuba:ro
    - gomodcache:/go/pkg/mod
    - gocache:/root/.cache/go-build

services:
  db:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_DB: discovery-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LANG: C
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "discovery-db"]
      interval: 2s
      retries: 30

  # creates the database if needed, then applies pkgsite's migrations
  migrate:
    <<: *go
    environment:
      <<: *database
    command: bash -c "go run ./devtools/cmd/db create && go run ./devtools/cmd/db migrate"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *go
    environment:
      <<: *database
      PORT: "8000"
      GO_DISCOVERY_LOG_LEVEL: info
    command: >
      go run ./cmd/worker -queue=postgres
      -poll_index_period=${LYUBA_POLL:-1m} -poll_index_limit=200
      -enqueue_period=${LYUBA_POLL:-1m} -enqueue_limit=50
    restart: on-failure
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    <<: *go
    environment:
      <<: *database
      PORT: "8080"
    command: go run ./cmd/frontend -host=0.0.0.0:8080 -queue=postgres
    # the worker and the frontend both create the queue in Postgres at
    # startup: if they do it at the same time, the loser restarts
    restart: on-failure
    ports:
      - 8080:8080
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  gomodcache:
  gocache:
